name: PSP smoke-test build

on:
  push:
    paths:
      - "psp/**"
      - "native/**"
      - ".github/workflows/psp-smoke-build.yml"
  pull_request:
    paths:
      - "psp/**"
      - "native/**"
      - ".github/workflows/psp-smoke-build.yml"
  workflow_dispatch:

jobs:
  build-psp-render-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build EBOOT.PBP with PSPDEV SDK
        run: |
          docker run --rm \
            -v "$PWD:/source" \
            -w /source/psp \
            pspdev/pspdev:latest \
            sh -lc 'make clean && make'

      - name: Verify EBOOT artifact exists
        run: test -s psp/EBOOT.PBP

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: ufo50-psp-render-smoke-test
          path: psp/EBOOT.PBP
          if-no-files-found: error
