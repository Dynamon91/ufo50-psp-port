name: native-renderer-regression

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/viewport-test.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/viewport-test.yml"
  workflow_dispatch:

jobs:
  native-renderer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile viewport regression test
        run: cc -std=c99 -Wall -Wextra -Werror -Inative native/test_viewport.c -o /tmp/test_viewport
      - name: Run viewport regression test
        run: /tmp/test_viewport
      - name: Compile RGB565 scaler regression test
        run: cc -std=c99 -Wall -Wextra -Werror -Inative native/test_scale_rgb565.c -o /tmp/test_scale_rgb565
      - name: Run RGB565 scaler regression test
        run: /tmp/test_scale_rgb565
      - name: Compile PSP framebuffer presentation regression test
        run: cc -std=c99 -Wall -Wextra -Werror -Inative native/test_psp_framebuffer.c -o /tmp/test_psp_framebuffer
      - name: Run PSP framebuffer presentation regression test
        run: /tmp/test_psp_framebuffer

      - name: Compile framebuffer tests with UndefinedBehaviorSanitizer
        run: cc -std=c99 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -Inative native/test_viewport.c -o /tmp/test_viewport_ubsan && cc -std=c99 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -Inative native/test_scale_rgb565.c -o /tmp/test_scale_rgb565_ubsan && cc -std=c99 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all -Inative native/test_psp_framebuffer.c -o /tmp/test_psp_framebuffer_ubsan
      - name: Run viewport UBSan test
        run: /tmp/test_viewport_ubsan
      - name: Run RGB565 scaler UBSan test
        run: /tmp/test_scale_rgb565_ubsan
      - name: Run framebuffer presentation UBSan test
        run: /tmp/test_psp_framebuffer_ubsan
